name: ci

# Two jobs on purpose. `verify` is the gate a PR has to pass and it must run on
# the smallest possible dependency set, because that is what a judge will
# install. `ml` is allowed to be slow and to pull PyTorch, so it can check the
# TabPFN path without holding anything else up.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Fail fast on the first failing step rather than accumulating minutes of red.
  UV_NO_PROGRESS: "1"

jobs:
  verify:
    name: tests + lint (no PyTorch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # No `--group ml` on purpose: this job proves the default install is fast
      # and that Baahar works without PyTorch, which is the promise in the README.
      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests (offline)
        run: uv run pytest --cov=baahar --cov-report=term-missing

      - name: CLI smoke test, no keys, no network
        env:
          # Belt and braces: these make a leaked key or a live call impossible.
          BAAHAR_OFFLINE: "1"
          GEMINI_API_KEY: ""
        run: |
          set -euo pipefail

          # Run a command, assert its exit status, and preview the output.
          #
          # Deliberately *not* `cmd | head -n`: `head` closes the pipe as soon as
          # it has enough lines, the writer dies of SIGPIPE, and `pipefail` then
          # reports the whole pipeline as failed. Writing to a file first keeps
          # the exit status meaningful and prints the log when something breaks.
          run() {
            local out
            out="$(mktemp)"
            if ! "$@" > "$out" 2>&1; then
              echo "::error::command failed with a non-zero exit: $*"
              cat "$out"
              rm -f "$out"
              exit 1
            fi
            head -n 25 "$out"
            rm -f "$out"
          }

          run uv run baahar check
          run uv run baahar brief --city Bengaluru --offline --model template
          run uv run baahar parks --limit 3
          run uv run baahar journal
          run uv run baahar score --offline
          run uv run baahar score --offline --json
          run uv run baahar version

          # The JSON must actually parse, not merely exit zero.
          # `uv run python`, because a bare `python` is not on PATH in this job.
          uv run baahar score --offline --json > score.json
          uv run python - <<'PY'
          import json

          with open("score.json", encoding="utf-8") as fh:
              data = json.load(fh)
          assert data["slots"], "expected at least one scored hour"
          assert data["overall"] in {"GO", "WAIT", "SKIP"}, data["overall"]
          assert all("signals" in s for s in data["slots"]), "slots must carry signals"
          print(f"score --json parses: {len(data['slots'])} slots, overall={data['overall']}")
          PY
          rm -f score.json

      - name: Verify no secrets are committed
        run: |
          if git ls-files | grep -qE '^\.env$'; then
            echo "::error::.env is tracked in git"
            exit 1
          fi
          # Look for anything shaped like a credential in tracked files.
          if git grep -nIE '(gho_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}|sk-[A-Za-z0-9]{32,})' -- \
               ':!*.lock' ':!.github/*' ; then
            echo "::error::possible secret found in tracked files"
            exit 1
          fi
          echo "no secrets detected"

      # The other half of the same rule. The gate above greps for credential
      # *shapes*; it would not have caught the incident that actually happened
      # here, because `data/journal.jsonl` holds no key. It held a person's
      # unreviewed field notes and had to be force-pushed out of history. So
      # assert that the paths `.gitignore` protects are still untracked.
      - name: Verify no denylisted path is tracked
        run: uv run python scripts/check_untracked.py

      # The honest-numbers guard. `run_eval.py` reads the committed dataset and
      # needs no network, so CI can reproduce the tabular numbers and then check
      # that eval/RESULTS.md actually reports them.
      #
      # This is what makes "every number came from a real run" enforceable
      # rather than aspirational: if someone edits a figure in RESULTS.md, or
      # claims a number for a model whose run reported SKIPPED, this fails the
      # build.
      - name: Re-run the tabular eval from the committed dataset
        run: uv run python scripts/run_eval.py

      - name: Check RESULTS.md against the raw artifacts
        run: uv run python scripts/check_results.py

      # The frozen briefing candidate evidence, verified as far as this
      # repository honestly can. `report_briefing_candidates.py` re-derives the
      # decision from the graded dataset, and run 20261007T184549Z-fb0d6990's
      # dataset is not in any commit -- it predates the first commit of
      # data/ft_v2 and its builder was never committed. This checks the contract
      # snapshot, re-derives every published number from the recorded
      # generations, and fails if the acknowledged gap stops being documented.
      - name: Verify frozen briefing candidate evidence
        run: uv run python scripts/check_frozen_candidate_evidence.py

      # The other published prose. post.md, README.md and docs/DOD.md had drifted
      # four separate ways -- a wrong judge model, two stale test counts, a
      # naqi_basis literal the code stopped emitting, and a TabPFN row presented
      # as current when the newest run skipped it. check_results.py only reads
      # eval/RESULTS.md, so none of that was caught until a human read it.
      - name: Check the published prose against the repo and the artifacts
        run: uv run python scripts/check_docs.py

  ml:
    name: TabPFN path (PyTorch, slow)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install with the heavy ML group
        run: uv sync --group dev --group ml

      - name: Confirm the TabPFN adapter degrades honestly
        # Without a licence token this must return a *reason*, not a traceback,
        # and must not claim a scorer it did not use.
        run: |
          uv run python - <<'PY'
          from baahar.score import tabpfn_available, choose_scorer

          available, reason = tabpfn_available()
          name, note = choose_scorer("tabpfn")
          print(f"tabpfn available={available} reason={reason}")
          print(f"choose_scorer('tabpfn') -> {name}: {note}")

          assert name in {"heuristic", "tabpfn"}, name
          if not available:
              assert note, "an unavailable TabPFN must explain itself"
              assert name == "heuristic"
          print("OK")
          PY

      - name: Tests with numpy available
        run: uv run pytest -m "not ml"

  ui:
    name: Pocket Mode layout audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Pocket Mode behaviour (no browser or server)
        run: node scripts/app_state_test.mjs

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: |
          uv python install 3.12
          uv sync --group dev

      # Live data on purpose. Pocket Mode only renders when the brief
      # authorises a walk *now*, and `walk.eligibility` deliberately refuses
      # recorded data as permission, so an offline server can never show the
      # pocket, journal or species screens. With live data this job audits
      # them on a GO hour and prints a SKIPPED line naming the screens and the
      # verdict when the hour is not GO -- see scripts/ui_check.mjs.
      - name: Serve Baahar
        env:
          GEMINI_API_KEY: ""
        run: |
          nohup uv run baahar serve --port 8000 > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
              echo "server up"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server never came up"
          cat server.log
          exit 1

      # Headless Chrome is preinstalled on ubuntu-latest, so scripts/ui_check.mjs
      # needs no npm install. It fails the build on console errors, horizontal
      # overflow, or a screen that should have been dismissed.
      - name: Screenshot every screen and audit the layout
        run: node scripts/ui_check.mjs --out artifacts

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pocket-mode-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore