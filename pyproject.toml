[project]
name = "baahar"
version = "0.1.0"
description = "Baahar (बाहर) — finds Bengaluru's next safe outdoor hour (AQI + heat + rain), generates a ~30s park briefing with open AI, then Pocket Mode so the phone goes dark while you walk."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Vedant Mahajan" }]
keywords = [
  "aqi",
  "bengaluru",
  "outdoor",
  "open-source-ai",
  "gemma",
  "tabpfn",
  "touch-grass",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]

# The runtime dependency list is deliberately tiny: httpx, FastAPI, Typer,
# pydantic. No PyTorch, no pandas, no numpy. `uv sync` finishes in well under a
# minute so the README's five-minute quickstart is a real promise rather than
# an aspiration. Rationale: docs/adr/000-stack-choice.md
dependencies = [
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[project.scripts]
baahar = "baahar.cli:main"

[project.urls]
Homepage = "https://github.com/Vedant817/baahar"
Repository = "https://github.com/Vedant817/baahar"
Issues = "https://github.com/Vedant817/baahar/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baahar"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/data",
  "/scripts",
  "/eval",
  "/docs",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/AGENTS.md",
]

# ---------------------------------------------------------------------------
# uv dependency groups (not PEP 621 extras, so they never leak into a consumer's
# install when this is used as a library)
# ---------------------------------------------------------------------------

[dependency-groups]
# The default development environment: tests, lint, and the lightweight tabular
# baselines the eval compares TabPFN against. All of this installs in seconds.
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
]

# Heavy and opt-in. TabPFN pulls PyTorch, which is ~2.5 GB on Windows. Kept out
# of `dev` so that `uv sync` stays fast and the disk-frugal constraint in
# AGENTS.md is respected by default. Baahar is fully functional without it.
ml = [
  "tabpfn>=2.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "network: test needs live internet access",
  "gemini: test needs a real GEMINI_API_KEY",
  "ml: test needs the heavy optional ML group",
]

[tool.coverage.run]
source = ["src/baahar"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
  "E501", # long lines are handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
# Fixture factories legitimately shadow builtins and use fixture-style names.
"tests/conftest.py" = ["A002"]
"tests/*" = ["S101"]